services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-job_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-job_tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_tracker_password}
    ports:
      # Keep PostgreSQL available from tools such as pgAdmin on the host.
      # Use a different host port so a local PostgreSQL service can keep using 5432.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      # Docker keeps this named volume when containers are stopped or recreated.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-job_tracker} -d ${POSTGRES_DB:-job_tracker}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      # Containers use the Compose service name 'postgres', not localhost.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-job_tracker}:${POSTGRES_PASSWORD:-local_tracker_password}@postgres:5432/${POSTGRES_DB:-job_tracker}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local_docker_development_secret_change_before_sharing_123456}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-30}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # This URL is used by the browser on the host, not by the frontend container.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
